<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Migration Review</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar">
    <span class="brand">Content Migration</span>
    <nav>
      <button id="nav-overview" class="active">Overview</button>
      <button id="nav-items">Items</button>
      <button id="nav-assets">Assets</button>
      <button id="nav-changes">Changes</button>
      <button id="nav-stats">Stats</button>
      <button id="nav-issues">Issues</button>
      <button id="nav-redirects">301s</button>
      <button id="nav-verify">Verify</button>
      <button id="nav-report">Report</button>
      <button id="nav-log">Log</button>
    </nav>
    <button id="export-btn" title="Choose collections and items, then write corrected CSVs (exact copies, URLs replaced only) to workspace/output/">⬇ Export CSVs</button>
  </header>
  <div id="body-row">
    <aside id="sidebar">
      <div id="file-tree"></div>
    </aside>
    <main id="main">
      <div id="empty" class="empty" hidden>Select a CMS item on the left.</div>
      <div id="overview-view"></div>
      <div id="item-view" hidden></div>
      <div id="assets-view" hidden></div>
      <div id="changes-view" hidden></div>
      <div id="stats-view" hidden></div>
      <div id="issues-view" hidden></div>
      <div id="export-view" hidden></div>
      <div id="redirects-view" hidden></div>
      <div id="verify-view" hidden></div>
      <div id="report-view" hidden></div>
      <div id="log-view" hidden></div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
